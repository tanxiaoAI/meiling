# Docker Compose 测试配置
# 使用简化的测试版 Dockerfile

services:
  # OpenCode 测试服务
  opencode:
    build:
      context: ../../opencode-service
      dockerfile: Dockerfile.test

    container_name: opencode-test

    environment:
      - TENANT_ID=test001
      - TENANT_NAME=测试客户
      - OPENCODE_SERVER_USERNAME=opencode
      - OPENCODE_SERVER_PASSWORD=test_password
      - DATABASE_URL=postgresql://testuser:testpass@postgres:5432/testdb
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-test}
      - MODEL_PROVIDER=anthropic
      - MODEL_NAME=claude-3-5-sonnet-20241022
      - WORKSPACE_DIR=/workspace
      - CORE_ASSETS_DIR=/opt/core-assets
      - INTERNAL_DIR=/workspace-internal
      - NODE_ENV=development
      - PORT=3000

    volumes:
      - workspace-test:/workspace
      - workspace-internal-test:/workspace-internal

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ai-media-network

    restart: unless-stopped

  # PostgreSQL 数据库
  postgres:
    image: postgres:14-alpine

    container_name: postgres-test

    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass

    volumes:
      - postgres-data-test:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ai-media-network

    restart: unless-stopped

volumes:
  workspace-test:
    driver: local
  workspace-internal-test:
    driver: local
  postgres-data-test:
    driver: local

networks:
  ai-media-network:
    driver: bridge
