# Docker Compose 配置
# 用于正式链路的本地验证

services:
  # OpenCode 服务
  opencode:
    build:
      context: ../../opencode-service
      dockerfile: Dockerfile
      args:
        OPENCODE_BASE_IMAGE: ${OPENCODE_BASE_IMAGE:-ghcr.io/anomalyco/opencode:1.16.2}

    container_name: opencode-prod-local

    environment:
      - TENANT_ID=test001
      - TENANT_NAME=测试客户
      - OPENCODE_LOCAL_BASIC_AUTH=${OPENCODE_LOCAL_BASIC_AUTH:-false}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-test_password}
      - DATABASE_URL=postgresql://testuser:testpass@postgres:5432/testdb
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENCODE_CONFIG_CONTENT={"$$schema":"https://opencode.ai/config.json","model":"deepseek/deepseek-chat","server":{"port":4096,"hostname":"0.0.0.0"}}
      - WORKSPACE_DIR=/workspace
      - CORE_ASSETS_DIR=/opt/core-assets
      - INTERNAL_DIR=/workspace-internal
      - PORT=4096
      - HOST=0.0.0.0
      - NODE_ENV=production

    volumes:
      - workspace-prod-local:/workspace
      - workspace-internal-prod-local:/workspace-internal

    ports:
      - "4096:4096"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ai-media-network

    restart: unless-stopped

  # PostgreSQL 数据库
  postgres:
    image: postgres:14-alpine

    container_name: postgres-prod-local

    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass

    volumes:
      - postgres-data-prod-local:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ai-media-network

    restart: unless-stopped

volumes:
  workspace-prod-local:
    driver: local
  workspace-internal-prod-local:
    driver: local
  postgres-data-prod-local:
    driver: local

networks:
  ai-media-network:
    driver: bridge
